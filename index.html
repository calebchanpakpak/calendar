<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calendar</title>
<!-- Calendar V3.2 (local-first PWA, GitHub Pages): static files + IndexedDB on the phone + background sync to the
     Apps Script JSON API (Api.gs doPost). The UI is the V2.4 page. No server URL or token in this file:
     both are typed once in the Connection sheet and stay on the phone. -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#5a6dbe">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Calendar">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  /* v2.1 theme: soft pink-blue. Event colour groups (CONFIG.COLORS) are not part of the theme. */
  :root {
    --bg1:#fdf1f5; --bg2:#eef2fc;            /* page: blush -> pale periwinkle */
    --card:#fcfbfe; --line:#e4e1f0; --line-soft:#efecf6;
    --primary:#5a6dbe; --primary-hover:#4f62b0; /* periwinkle, darkened from #7c8fd6 so white text stays readable */
    --accent:#e6a5bd; --accent-light:#f7dce6;   /* dusty pink: active tab, toggles, focus ring */
    --text:#2e3047; --muted:#6e7089;
    --today-col:#fbf0f5; --other-day:#f6f4fb;
    --danger:#b8325e; --danger-light:#fbe8ef;
  }
  body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin:0; color:var(--text); min-height:100vh;
         background:linear-gradient(160deg, var(--bg1) 0%, var(--bg2) 100%) fixed; }
  header { position:sticky; top:0; background:rgba(252,251,254,.92); backdrop-filter:blur(6px); border-bottom:1px solid var(--line); padding:10px 14px; display:flex; flex-wrap:wrap; gap:10px; align-items:center; z-index:5; }
  h1 { font-size:18px; margin:0 8px 0 0; color:var(--text); }
  label { font-size:14px; cursor:pointer; }
  input[type=checkbox] { accent-color:var(--accent); }
  button { font:inherit; font-size:14px; padding:5px 11px; border-radius:6px; border:1px solid var(--line); background:var(--card); color:var(--text); cursor:pointer; }
  button:hover { background:var(--accent-light); border-color:var(--accent); }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline:none; box-shadow:0 0 0 3px rgba(230,165,189,.6); border-color:var(--accent); }
  button.primary { background:var(--primary); color:#fff; border-color:var(--primary); }
  button.primary:hover { background:var(--primary-hover); border-color:var(--primary-hover); }
  .tabs button.on { background:var(--accent); color:var(--text); border-color:var(--accent); font-weight:600; }
  .nav { display:none; gap:6px; align-items:center; } .nav.show { display:flex; }
  #rangeLabel { font-weight:600; font-size:14px; min-width:130px; }
  #status { font-size:13px; color:var(--muted); }
  main { max-width:1100px; margin:0 auto; padding:10px 12px 80px; }
  /* list view */
  #list { max-width:820px; margin:0 auto; }
  .day h2 { font-size:14px; color:var(--muted); margin:18px 0 6px; border-bottom:1px solid var(--line); padding-bottom:4px; }
  .day.today h2 { color:var(--primary); }
  .ev { display:flex; gap:10px; padding:8px 10px; margin:4px 0; border-radius:6px; border-left:5px solid; background:var(--card); }
  .time { width:92px; flex:none; font-size:13px; color:#4a4c66; }
  .title { font-weight:600; font-size:14px; }
  .meta { font-size:12px; color:var(--muted); margin-top:2px; white-space:pre-wrap; }
  .badge { font-size:11px; padding:1px 6px; border-radius:8px; background:rgba(46,48,71,.07); margin-left:6px; font-weight:400; }
  /* week view */
  .wk { overflow-x:auto; background:var(--card); border:1px solid var(--line); border-radius:8px; }
  .wk-inner { min-width:700px; }
  .wk-head, .wk-allday { display:grid; grid-template-columns:44px repeat(7, 1fr); border-bottom:1px solid var(--line); }
  .wk-head div { font-size:12px; text-align:center; padding:4px 2px; color:var(--muted); }
  .wk-head div.today { color:var(--primary); font-weight:700; }
  .wk-allday > div { border-left:1px solid var(--line-soft); padding:2px; min-height:20px; }
  /* v2.4: a multi-day event is ONE bar across its days in the top strip (all-day and timed alike) */
  .wk-allday > div.wk-bar { border-left:0; padding:0 5px; min-height:0; height:14px; line-height:14px; font-size:11px; margin:1px 2px; border-radius:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; z-index:1; cursor:pointer; }
  .wk-allday > div.wk-bar.cl { border-top-left-radius:0; border-bottom-left-radius:0; margin-left:0; }
  .wk-allday > div.wk-bar.cr { border-top-right-radius:0; border-bottom-right-radius:0; margin-right:0; }
  .wk-allday > div.wk-ad-chips { border-left:0; min-height:0; padding:0 2px 2px; }
  .chip { font-size:11px; border-radius:4px; padding:1px 4px; margin:1px 0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; cursor:default; }
  .wk-body { position:relative; display:grid; grid-template-columns:44px repeat(7, 1fr); height:520px; overflow-y:auto; }
  .wk-hours { position:relative; }
  .wk-hours div, .wk-col .hr { position:absolute; left:0; right:0; height:40px; border-top:1px solid var(--line-soft); font-size:10px; color:#9a9cb2; text-align:right; padding-right:4px; box-sizing:border-box; }
  .wk-col { position:relative; border-left:1px solid var(--line-soft); height:960px; }
  .wk-col.today { background:var(--today-col); }
  .blk { position:absolute; border-radius:4px; padding:1px 3px; font-size:11px; overflow:hidden; box-sizing:border-box; border:1px solid rgba(255,255,255,.7); line-height:1.2; }
  .now { position:absolute; left:0; right:0; border-top:2px solid #d9547f; z-index:3; }
  /* month view – fixed equal cells, fills the phone screen (no vertical scroll) */
  #month { overflow:hidden; }
  .mo { background:var(--card); border:1px solid var(--line); border-radius:8px; overflow:hidden; height:100%; display:flex; flex-direction:column; }
  .mo-dows { flex:none; display:grid; grid-template-columns:repeat(7, 1fr); }
  .mo-week { flex:1 1 0; min-height:0; display:grid; grid-template-columns:repeat(7, 1fr); position:relative; }
  .mo .dow { font-size:11px; text-align:center; padding:3px 0; color:var(--muted); border-bottom:1px solid var(--line); }
  .mo .cell { position:relative; min-height:0; height:100%; box-sizing:border-box; border-right:1px solid var(--line-soft); border-bottom:1px solid var(--line-soft); padding:1px 2px; cursor:pointer; min-width:0; overflow:hidden; }
  .mo .cell:hover { background:#fdf6f9; }
  .mo .cell.other { background:var(--other-day); color:#a9aabd; }
  .mo .cell.today { background:#fbeef4; box-shadow:inset 0 0 0 2px var(--accent); }
  .mo .cell.today .num { background:var(--primary); color:#fff; border-radius:10px; padding:0 6px; }
  .mo .num { font-size:12px; display:inline-block; line-height:14px; flex:none; }
  .mo .fest { font-size:9px; line-height:1.1; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; flex:1; opacity:.9; }
  .mo .cell.festive { /* bg set inline from CalFestivals (may be diagonal gradient) */ }
  .mo .cell .fest-stack { display:flex; flex-direction:column; align-items:flex-end; gap:0; max-width:72%; line-height:1.05; }
  .mo .cell .fest { font-size:8px; font-weight:600; opacity:.85; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }
  .mo .cell.festive::before, .mo .cell.festive::after { pointer-events:none; }
  /* V3.2 minor: all marker emojis (festival + anniversary/100-day) sit bottom-right */
  .mo .cell.festive[data-emoji]::before {
    content: attr(data-emoji); position:absolute; bottom:2px; right:2px; font-size:15px; opacity:.22; line-height:1; z-index:0;
  }
  .mo .cell.festive[data-emoji][data-emoji2]::before {
    right:18px; font-size:14px; /* sit beside data-emoji2, not on top of it */
  }
  .mo .cell.festive[data-emoji2]::after {
    content: attr(data-emoji2); position:absolute; bottom:2px; right:2px; font-size:14px; opacity:.22; line-height:1; z-index:0;
  }
  .mo .cell .numline, .mo .cell .slot, .mo .cell .more, .mo .cell .chip { position:relative; z-index:1; }
  .mo .cell.festive > * { position:relative; z-index:1; }
  /* fixed slot rows so spanning bars line up; empty slots keep height so rows don't shrink */
  .mo .numline { height:var(--mo-top, 18px); margin-bottom:0; display:flex; align-items:center; gap:2px; overflow:hidden; }
  .mo .slot { height:var(--mo-row, 14px); line-height:var(--mo-row, 14px); margin:0; box-sizing:border-box; }
  .mo .chip.slot { padding:0 3px; font-size:10px; }
  .mo .more { height:var(--mo-more, 12px); line-height:var(--mo-more, 12px); font-weight:600; color:var(--primary); padding:0 2px; cursor:pointer; font-size:10px; }
  .more { font-size:11px; color:var(--muted); }

  /* form */
  form { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:12px; margin:0 auto 12px; max-width:820px; display:none; gap:8px; flex-wrap:wrap; }
  form.open { display:flex; }
  form input, form select, form textarea { font:inherit; font-size:14px; padding:5px; border:1px solid #d6d2e6; border-radius:4px; background:#fff; color:var(--text); }
  form .row { display:flex; flex-wrap:wrap; gap:8px; width:100%; align-items:center; }
  .sugg-wrap { position:relative; flex:1; min-width:200px; z-index:11; }
  .sugg-wrap input { width:100%; box-sizing:border-box; }
  #sugg, #famSugg { position:absolute; left:0; right:0; top:100%; background:var(--card); border:1px solid var(--line); border-radius:4px; z-index:30; max-height:220px; overflow-y:auto; display:none; box-shadow:0 4px 14px rgba(46,48,71,.2); -webkit-overflow-scrolling:touch; }
  #sugg div, #famSugg div { padding:10px 10px; cursor:pointer; font-size:15px; -webkit-tap-highlight-color:transparent; } #sugg div.act, #sugg div:hover, #famSugg div.act, #famSugg div:hover { background:var(--accent-light); }
  .sw { width:26px; height:26px; border-radius:50%; border:2px solid #fff; box-shadow:0 0 0 1px #c9c5dc; cursor:pointer; padding:0; }
  .sw.on { box-shadow:0 0 0 3px var(--text); }
  .pchip { font-size:13px; padding:3px 10px; border-radius:14px; border:1px solid; background:var(--card); cursor:pointer; }
  .muted { font-size:12px; color:var(--muted); }
  .hide { display:none !important; }
  /* v2.1: delete button + event details popup */
  .ev .body { flex:1; min-width:0; }
  button.del { flex:none; align-self:flex-start; font-size:12px; padding:2px 8px; color:var(--danger); border-color:#ebc3d2; background:var(--card); }
  button.del:hover { background:var(--danger-light); border-color:var(--danger); }
  button.danger { background:var(--danger); color:#fff; border-color:var(--danger); }
  button.danger:hover { background:#a82d56; border-color:#a82d56; }
  .chip[data-id], .blk[data-id] { cursor:pointer; }
  #popBack { position:fixed; inset:0; background:rgba(46,48,71,.35); z-index:20; display:flex; align-items:center; justify-content:center; padding:12px; }
  #pop { background:var(--card); border-radius:8px; padding:14px; max-width:420px; width:100%; box-shadow:0 4px 18px rgba(46,48,71,.25); border-top:6px solid; }
  #pop .title { font-size:16px; margin-bottom:4px; }
  #pop .row { display:flex; gap:8px; justify-content:flex-end; margin-top:12px; flex-wrap:wrap; }
  /* v2.2: edit screen, month spanning bars + day markers, day preview, swipe + slide */
  .ev { cursor:pointer; } .ev:hover { filter:brightness(.97); }
  #editHead .ttl { font-weight:600; }
  #addForm { scroll-margin-top:72px; }   /* stays clear of the sticky top bar when opened from Week / Month */
  #editNote { flex:1; }
  .bar { position:absolute; height:14px; line-height:14px; font-size:11px; padding:0 5px; border-radius:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; box-sizing:border-box; z-index:2; cursor:pointer; }
  .bar.cl { border-top-left-radius:0; border-bottom-left-radius:0; }
  .bar.cr { border-top-right-radius:0; border-bottom-right-radius:0; }
  .marks { display:inline-flex; gap:2px; overflow:hidden; }   /* v2.3: the per-day dots sit beside the day number (no row of their own) */
  .mk { width:6px; height:6px; flex:none; border-radius:50%; display:inline-block; }
  #month, #week { user-select:none; -webkit-user-select:none; }
  #month { touch-action:pan-y; }
  .slide-l { animation:slideL .22s ease-out; } .slide-r { animation:slideR .22s ease-out; }
  @keyframes slideL { from { transform:translateX(36px); opacity:.35; } to { transform:none; opacity:1; } }
  @keyframes slideR { from { transform:translateX(-36px); opacity:.35; } to { transform:none; opacity:1; } }
  @media (prefers-reduced-motion: reduce) { .slide-l, .slide-r { animation:none; } }
  #pop h3 { margin:0 0 8px; font-size:16px; }
  .dp-ev { display:flex; gap:10px; padding:6px 8px; margin:4px 0; border-radius:6px; border-left:4px solid; cursor:pointer; font-size:14px; }
  .dp-time { width:100px; flex:none; font-size:13px; color:#4a4c66; }
  .dp-empty { text-align:center; color:var(--muted); padding:18px 0 8px; font-size:15px; }
  #pop .row.center { justify-content:center; }
  button.big { font-size:16px; padding:8px 20px; }
  /* v2.3: "Only this event / All events" chooser (big touch targets) + Duplicate (Both) fields */
  .scope-btn { display:block; width:100%; text-align:left; min-height:58px; font-size:16px; padding:10px 14px; margin:8px 0 0; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--text); cursor:pointer; box-sizing:border-box; }
  .scope-btn:hover, .scope-btn:active { background:var(--accent-light); border-color:var(--accent); }
  .scope-btn b { display:block; font-size:16px; } .scope-btn span { display:block; font-size:13px; color:var(--muted); margin-top:2px; }
  #pop .scope-sub { font-size:14px; color:#4a4c66; margin-bottom:4px; }
  #scopeCancel { font-size:16px; padding:8px 22px; }
  #famRow input { flex:1; min-width:160px; }
  @media (max-width:600px) { .time { width:70px; } .mo .cell { padding:1px; } .bar { font-size:10px; padding:0 3px; } .chip { font-size:10px; } }
  /* ===== V3: sync pill (as Vault V3), settings, toast, update bar ===== */
  .topline { display:flex; align-items:center; gap:8px; width:100%; }
  .topline .sp { flex:1; }
  .gear { border-radius:999px; padding:4px 9px; }
  .syncpill { flex:none; border:1.5px solid var(--line); background:#fff; border-radius:999px; padding:5px 10px; font-size:12px; font-weight:600; color:var(--muted); white-space:nowrap; max-width:56vw; overflow:hidden; text-overflow:ellipsis; }
  .syncpill:hover { background:#fff; }
  .syncpill.ok { color:#16a34a; border-color:#bbf7d0; }
  .syncpill.pend { color:#075985; border-color:#bae6fd; background:#f0f9ff; }
  .syncpill.off { color:#374151; background:#f3f4f6; }
  .syncpill.bad { color:var(--danger); border-color:#fecaca; background:#fef2f2; }
  .syncpill.busy { color:var(--primary); }
  .syncpill small { font-weight:400; opacity:.8; }
  .badge.pend { background:#e0f2fe; color:#075985; }
  .toast { pointer-events:none; position:fixed; left:50%; top:calc(14px + env(safe-area-inset-top)); text-align:center; line-height:1.4; transform:translateX(-50%) translateY(-140px); background:#2e3047; color:#fff; padding:10px 16px; border-radius:12px; font-size:14px; z-index:50; transition:transform .25s; max-width:90%; }
  .toast.on { transform:translateX(-50%) translateY(0); }
  .netbar { display:flex; align-items:center; justify-content:space-between; gap:8px; background:var(--accent-light); padding:8px 14px; font-size:13px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin:8px 0; }
  .card .ct { font-weight:600; font-size:14px; margin-bottom:6px; }
  .kv { display:flex; justify-content:space-between; gap:10px; font-size:13px; padding:4px 0; border-bottom:1px solid var(--line-soft); }
  .kv:last-child { border-bottom:0; }
  .kv span:first-child { color:var(--muted); }
  .kv span:last-child { text-align:right; }
  .stack { display:flex; flex-direction:column; gap:8px; margin-top:10px; }
  .stack button { padding:9px 12px; }
  .fld { display:block; font-size:13px; color:var(--muted); margin:10px 0 4px; }
  .fld + input { width:100%; box-sizing:border-box; font-size:16px; padding:8px; border:1px solid var(--line); border-radius:6px; }
  .hint { font-size:12px; color:var(--muted); margin-top:8px; }
  .failrow { font-size:13px; padding:6px 0; border-bottom:1px solid var(--line-soft); }
  .failrow b { display:block; }
</style>
</head>
<body>
<div id="toast" class="toast"></div>
<div id="updbar"></div>
<header>
  <div class="topline"><h1>Calendar</h1><span class="sp"></span><button type="button" class="gear" id="gearBtn" title="Settings">⚙︎</button><button type="button" class="syncpill" id="syncPill">…</button></div>
  <span class="tabs"><button data-view="list" class="on">List</button> <button data-view="week">Week</button> <button data-view="month">Month</button></span>
  <span class="nav" id="nav"><button id="prevBtn">‹</button><button id="todayBtn">Today</button><button id="nextBtn">›</button><span id="rangeLabel"></span></span>
  <label><input type="checkbox" id="hideFamily"> Hide family</label>
  <label><input type="checkbox" id="hidePersonal"> Hide personal</label>
  <label id="pastWrap"><input type="checkbox" id="showPast"> Show past</label>
  <button class="primary" id="addBtn">+ Add event</button>
  <button type="button" id="dupBtn" title="Find leftover copies of family events in Google Calendar">Clean up duplicates</button>
  <span id="status">Loading…</span>
</header>
<main>
  <form id="addForm" autocomplete="off">
    <div class="row hide" id="editHead"><span class="ttl">Edit event</span><span id="editNote" class="muted"></span></div>
    <div class="row">
      <select name="category" id="category">
        <option value="personal">Personal only</option>
        <option value="family">Family</option>
        <option value="both">Duplicate (Both)</option>
      </select>
      <div class="sugg-wrap"><input name="title" id="title" placeholder="Title" required><div id="sugg"></div></div>
    </div>
    <div class="row" id="colorRow"><span class="muted">Colour:</span><span id="swatches" style="display:flex;gap:6px;flex-wrap:wrap"></span></div>
    <div class="row" id="presetRow"></div>
    <div class="row hide" id="famRow"><span class="muted">Family title:</span><div class="sugg-wrap"><input name="familyTitle" id="familyTitle" placeholder="C: mom" autocomplete="off"><div id="famSugg"></div></div><span class="muted">orange · Google Calendar</span></div>
    <div class="row hide" id="famPresetRow"></div>
    <div class="row hide" id="guestRow"><span class="muted">Share with (each ticked person gets an invite e-mail):</span><span id="guestBox"></span></div>
    <div class="row">
      <input type="date" name="date" id="date" required>
      <input type="time" name="startTime"> –
      <input type="time" name="endTime">
      <input type="date" name="endDate" title="End date (optional)">
      <label><input type="checkbox" name="allDay"> All day</label>
    </div>
    <div class="row">
      <span class="muted">Repeat:</span>
      <select name="freq" id="freq"><option value="none">Does not repeat</option><option value="weekly">Weekly</option><option value="monthly">Monthly</option><option value="yearly">Yearly</option></select>
      <span id="repOpts" class="hide" style="display:flex;flex-wrap:wrap;gap:8px;align-items:center">
        every <input type="number" name="interval" min="1" value="1" style="width:56px"> <span id="unit">week(s)</span>
        <select name="mode" id="mode" class="hide"><option value="date"></option><option value="weekday"></option></select>
        <select name="ends" id="ends"><option value="never">forever</option><option value="count">for … times</option><option value="until">until date</option></select>
        <input type="number" name="count" min="1" value="10" style="width:64px" class="hide" id="count">
        <input type="date" name="until" class="hide" id="until">
      </span>
    </div>
    <div class="row"><textarea name="description" placeholder="Description (optional)" rows="2" style="flex:1"></textarea></div>
    <div class="row"><button class="primary" type="submit" id="saveBtn">Save</button><button type="button" id="cancelBtn">Cancel</button><span style="flex:1"></span><button type="button" class="danger hide" id="formDelBtn">Delete</button></div>
  </form>
  <div id="list"></div>
  <div id="week" class="hide"></div>
  <div id="month" class="hide"></div>
  <div id="popBack" class="hide"><div id="pop"></div></div>
</main>
<script src="idb.js"></script>
<script src="tz.js"></script>
<script src="festivals.js"></script>
<script src="sync.js"></script>
<script>
/* ===== recurrence engine (pure functions, wall-clock dates as 'yyyy-MM-dd') ===== */
const DAY = 864e5, WD = ['SU','MO','TU','WE','TH','FR','SA'];
const ymd = s => { const p = s.split('-').map(Number); return Date.UTC(p[0], p[1] - 1, p[2]); };      // 'yyyy-MM-dd' -> UTC ms
const iso = t => new Date(t).toISOString().slice(0, 10);                                               // UTC ms -> 'yyyy-MM-dd'
const addDays = (s, n) => iso(ymd(s) + n * DAY);
const dow = s => new Date(ymd(s)).getUTCDay();                                                         // 0 = Sunday
const mins = hm => hm ? (+hm.slice(0, 2)) * 60 + (+hm.slice(3, 5)) : 0;

/** 'RRULE:FREQ=..;..' (+ optional ' | EXDATE: yyyy-MM-dd HH:mm, ...') -> {freq, interval, count, until, byday[], bymonthday[], bymonth[], ex:Set(dates)} */

/** Candidate dates of one month (y, m 1-12) for a MONTHLY/YEARLY rule, sorted. */

/** All occurrence start dates of event e that fall in [from, to] (inclusive, 'yyyy-MM-dd').

      segs.map(x => { const e = x.o.e, h = hex(e.color), w = 100 / x.lanes;

/** v2.4: the day under a tap on a Month bar: from the tap's x-position in its week row (else the cell under the

let ENG = null, started = false, shownVer = -1, lastMetaKey = '';
function toast(msg, ms) { const t = $('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), ms || 2200); }
const hhmm = ms => { if (!ms) return ''; const d = new Date(ms); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };
const whenFull = ms => ms ? new Date(ms).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '未同步 Never';

/* ----- top-right sync pill (same states / labels / tap as Vault V3) ----- */
function renderPill() {
  const s = ENG.status(), p = $('syncPill'), t = s.lastOkAt ? ' <small>· ' + hhmm(s.lastOkAt) + '</small>' : '';
  let cls, txt;

  else if (s.failed) { cls = 'bad'; txt = '⚠️ ' + s.failed + ' 項失敗'; }
  else if (s.state === 'syncing') { cls = 'busy'; txt = '🔄 同步緊'; }
  else if (!navigator.onLine || s.state === 'offline') { cls = 'off'; txt = '📴 離線' + (s.pending ? ' · ' + s.pending + ' 待同步' : ''); }
  else if (s.state === 'error') { cls = 'bad'; txt = '⚠️ 同步出錯'; }
  else if (s.pending) { cls = 'pend'; txt = '⏳ ' + s.pending + ' 待同步'; }
  else { cls = 'ok'; txt = '✓ 已同步'; }
  p.className = 'syncpill ' + cls; p.innerHTML = txt + t;
  p.title = s.lastError || '';
}

/** Runs a sync; the toast comes from syncToast, which hears EVERY finished sync (also automatic retries). */
async function bgSync(trigger) {
  if (!ENG) return;
  const r = await ENG.syncAll({ trigger: trigger, manual: trigger === 'manual' });
  if (r && r.skipped === 'nocfg' && trigger === 'manual') openConn();
  return r;
}
/** In-app toast when a sync finishes with something to say (quiet for background no-op pulls). */
function syncToast(r) {
  if (!r || r.skipped) return;
  const loud = r.trigger === 'manual' || r.trigger === 'write';
  if (r.failed && r.failed.length) toast('⚠️ ' + r.failed.length + ' 項同步失敗，撳右上角睇', 3500);
  else if (r.error) {
    if (r.auth) toast('🔑 Token 唔啱，撳 ⚙︎ › 連線設定 檢查', 4000);
    else if (r.network) { if (loud) toast('📴 連唔到伺服器，改動已安全存喺部機，遲啲自動再試', 3500); }
    else if (r.busy) { if (r.trigger === 'manual') toast('⏳ 日曆忙緊（Google 同步中），遲啲自動再試', 3000); }
    else toast('⚠️ 同步出錯：' + r.error, 4000);
  }
  else if (r.ok) toast('已同步 ' + r.ok + ' 項 ✓');
  else if (r.first && r.pulled) toast('已載入日曆 ✓');
  else if (r.changed && r.trigger !== 'write') toast('已更新 ✓（有新改動）');
  else if (r.trigger === 'manual') toast('已經係最新 ✓');
}

  $('pop').innerHTML = '<h3>連線設定 Connection</h3>' +
    '<label class="fld" for="cn_url">Apps Script 網頁應用程式網址（/exec 結尾）</label>' +
    '<input id="cn_url" type="url" placeholder="https://script.google.com/macros/s/…/exec" autocapitalize="off" autocorrect="off" spellcheck="false" value="' + esc(c.url || '') + '">' +
    '<label class="fld" for="cn_tok">Token（日曆專用）</label>' +
    '<input id="cn_tok" type="password" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" value="' + esc(c.token || '') + '">' +
    '<div class="hint">只會存喺呢部機。網址同 token 唔好放上公開 GitHub。</div>' +
    '<div class="row"><button type="button" id="cn_cancel">Cancel</button><button type="button" class="primary" id="cn_save">Save</button></div>';
  $('cn_cancel').onclick = hidePop;
  $('cn_save').onclick = async () => {
    const url = $('cn_url').value.trim(), tok = $('cn_tok').value.trim();
    if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(url)) { toast('網址要係 https://script.google.com/…/exec', 3000); return; }
    if (tok.length < 20) { toast('請貼上日曆嘅 token', 3000); return; }
    await ENG.setCfg(url, tok);
    hidePop(); toast('已儲存，背景連線緊…'); renderPill();
    try { await ENG.call('ping', [], 30000); toast('連線成功 ✓'); bgSync('manual'); }
    catch (e) { toast(e.auth ? '🔑 Token 唔啱' : '⚠️ ' + e.message, 4000); }
  };
  $('popBack').classList.remove('hide');
}

/* ----- changes the server refused ----- */
function openFailed() {
  const rows = ENG.failed.map(f => {
    const o = f.op, what = o.kind === 'delete' ? 'Delete: ' + (o.ref.title || '') : (o.kind === 'add' ? 'Add: ' : 'Edit: ') + (o.form.title || '');
    return '<div class="failrow"><b>' + esc(what) + '</b>' + esc(f.error || '') + '</div>';
  }).join('');
  $('pop').style.borderTopColor = 'var(--danger)';
  $('pop').innerHTML = '<h3>同步失敗 Failed</h3><div class="hint">呢啲改動伺服器做唔到（例如嗰個活動喺 Sheet 度改咗／刪咗）。請喺 App 再做一次。</div>' +
    (rows || '<div class="hint">冇</div>') +
    '<div class="row"><button type="button" id="fl_clear" class="danger">清除 Clear</button><button type="button" id="fl_close">Close</button></div>';
  $('fl_clear').onclick = () => ENG.clearFailed().then(() => { hidePop(); renderPill(); });
  $('fl_close').onclick = hidePop;
  $('popBack').classList.remove('hide');
}

/* ----- boot: open IndexedDB → show the phone's copy at once → sync in the background ----- */
async function boot() {
  try {
    const db = await CalIDB.open();
    ENG = CalSync.create({ db: db });
    let raf = 0;
    ENG.onResult(syncToast);
    ENG.onChange(() => { renderPill(); if (ENG.ver !== shownVer && !raf) raf = requestAnimationFrame(() => { raf = 0; if (ENG.ver !== shownVer) refresh(); }); });
    await ENG.init();
    refresh(); renderPill(); started = true;
    if (navigator.storage && navigator.storage.persist) navigator.storage.persisted().then(p => p || navigator.storage.persist()).then(p => { persisted = p; }).catch(() => {});
    ENG.startAuto({ intervalMs: 600000 });   // every 10 min while open
    if (!ENG.cfg.url) openConn(); else bgSync('open');
  } catch (e) { $('status').textContent = 'Error: ' + e.message; }
}
window.addEventListener('online', () => { renderPill(); bgSync('online'); });
window.addEventListener('offline', () => renderPill());
let _lastTZ = (typeof CalTz !== 'undefined' ? CalTz.deviceTZ() : '');
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && started) {
    const tz = typeof CalTz !== 'undefined' ? CalTz.deviceTZ() : _lastTZ;
    const dayChanged = META.today !== CalSync.localToday();
    const tzChanged = tz !== _lastTZ;
    _lastTZ = tz;
    if (dayChanged || tzChanged) refresh();
    bgSync('visible');
  }
});
window.addEventListener('resize', () => { if (state.view === 'month') renderMonth(); });
if (window.visualViewport) visualViewport.addEventListener('resize', () => { if (state.view === 'month') renderMonth(); });

/* Service worker: app shell cache-first (opens instantly, also offline); a new version asks before reloading. */
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', async () => {
    try {
      const reg = await navigator.serviceWorker.register('sw.js');
      const prompt = w => {
        $('updbar').innerHTML = '<div class="netbar"><span>🆕 有新版本 New version</span><button type="button" id="swUpd">更新 Update</button></div>';
        $('swUpd').onclick = () => w.postMessage({ type: 'SKIP_WAITING' });
      };
      if (reg.waiting && navigator.serviceWorker.controller) prompt(reg.waiting);
      reg.addEventListener('updatefound', () => { const w = reg.installing; if (!w) return;
        w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) prompt(w); }); });
      let reloaded = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => { if (reloaded || !window.__swHadController) return; reloaded = true; location.reload(); });
      window.__swHadController = !!navigator.serviceWorker.controller;
      document.addEventListener('visibilitychange', () => { if (!document.hidden) reg.update().catch(() => {}); });
    } catch (e) { console.warn('SW register failed', e); }
  });
}
boot();
</script>
